name: Desktop builds
on:
  push:
    paths: ['desktop/**', '.github/workflows/desktop.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, windows-latest, macos-15, macos-15-intel]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r desktop/requirements.txt
      - run: python -m unittest discover -s desktop -p 'test_*.py'
      - run: python desktop/build.py
        env:
          GH_TOKEN: ${{ github.token }}
      - name: Smoke test packaged app
        shell: bash
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          if [[ "$RUNNER_OS" == "Windows" ]]; then
            desktop/dist/FrameDrop/FrameDrop.exe --smoke-test
          elif [[ "$RUNNER_OS" == "macOS" ]]; then
            desktop/dist/FrameDrop.app/Contents/MacOS/FrameDrop --smoke-test
          else
            desktop/dist/FrameDrop/FrameDrop --smoke-test
          fi
      - name: Archive executable permissions
        shell: bash
        run: tar -czf FrameDrop-${{ matrix.os }}.tar.gz -C desktop/dist .
      - uses: actions/upload-artifact@v4
        with:
          name: FrameDrop-${{ matrix.os }}
          path: FrameDrop-*.tar.gz
